name: Build BIN
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: pio
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        run: pio run
      - name: Upload BIN
        uses: actions/upload-artifact@v3
        with:
          name: firmware
          path: .pio/build/tiago-classic/firmware.bin
